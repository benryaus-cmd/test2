name: Engagement API Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/accountActivity.test.mjs
      - name: Compile storage page and App TSX syntax
        run: npx --yes --package esbuild@0.25.12 esbuild src/dev/StorageExplorer.tsx src/App.tsx --outdir=/tmp/storage-syntax --format=esm
